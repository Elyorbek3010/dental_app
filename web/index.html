<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dental Queue</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230D9488'/%3E%3Cpath d='M11.5 8.5c-2.2 0-4 1.8-4 4.2 0 2.1.8 4.4 1.5 6.8.5 1.8 1.2 4 2.3 4 .9 0 1.4-1.4 2-3 .5-1.4 1.2-2.2 2.7-2.2s2.2.8 2.7 2.2c.6 1.6 1.1 3 2 3 1.1 0 1.8-2.2 2.3-4 .7-2.4 1.5-4.7 1.5-6.8 0-2.4-1.8-4.2-4-4.2-1.4 0-2.5.7-3.5 1.4-.6.4-1.4.4-2 0-1-.7-2.1-1.4-3.5-1.4z' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('dental_theme') || 'system';
          var isDark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
