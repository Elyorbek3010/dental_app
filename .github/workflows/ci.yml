name: Dental Queue CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, feature/smart-call-auto-mode]

jobs:
  backend:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dental_ci
          POSTGRES_PASSWORD: dental_ci_password
          POSTGRES_DB: dental_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://dental_ci:dental_ci_password@localhost:5432/dental_db
      TEST_DATABASE_URL: postgresql+psycopg://dental_ci:dental_ci_password@localhost:5432/dental_app_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://dental_ci:dental_ci_password@localhost:5432/dental_app_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      TESTING: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify isolated Alembic migration upgrade & downgrade
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade f1a2b3c4d5e6
          python -m alembic upgrade head
          python -m alembic current

      - name: Run full backend test suite
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_*.py" -v

  web:
    name: Web Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run lint and production build
        working-directory: web
        run: |
          npm run lint
          npm run build

  flutter:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze & test Flutter app
        working-directory: mobile
        run: |
          flutter analyze
          flutter test
