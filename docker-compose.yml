services:
  postgres:
    image: postgres:16-alpine
    container_name: dental_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dental_db
      POSTGRES_USER: dental_user
      POSTGRES_PASSWORD: dental_password

    ports:
      - "5433:5432"

    volumes:
      - dental_postgres_data:/var/lib/postgresql/data

volumes:
  dental_postgres_data: